services:

  # INFRAESTRUCTURA BASE

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Retención de mensajes: 1 hora (útil para pruebas de backlog)
      KAFKA_LOG_RETENTION_MS: 3600000
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # INICIALIZADOR DE TOPICS KAFKA
  # Crea los topics necesarios antes de que arranquen los servicios
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creando topics de Kafka...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-retry --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-dlq --partitions 1 --replication-factor 1
      echo 'Topics creados:'
      kafka-topics --bootstrap-server kafka:9092 --list
      echo 'Inicialización completada.'
      "

  # CACHÉ (Redis) — mismo de Tarea 1
  # Configuración base justificada: 200mb LRU (balance entre hit rate y memoria)
  cache:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru

  # ALMACENAMIENTO DE MÉTRICAS — ampliado para Tarea 2
  datos:
    build: ./almacenamiento_datos
    container_name: modulo_datos
    ports:
      - "8000:8000"

  # GENERADOR DE RESPUESTAS — sin cambios respecto a Tarea 1
  respuestas:
    build: ./generador_respuestas
    container_name: modulo_respuestas
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "8001:8000"
    depends_on:
      - cache
      - datos
    environment:
      - REDIS_HOST=cache
      - DATOS_URL=http://datos:8000
    # Simular falla temporal: docker compose stop respuestas
    # Simular recuperación: docker compose start respuestas

  # GENERADOR DE TRÁFICO — ahora es un Kafka Producer
  trafico:
    build: ./generador_trafico
    container_name: modulo_trafico
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      datos:
        condition: service_started
      respuestas:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATOS_URL=http://datos:8000
      # Escenario de prueba: uniform | zipf | spike
      - ESCENARIO=zipf
      # Cantidad de consultas por ráfaga
      - NUM_CONSULTAS=500

  # CONSUMIDOR KAFKA — escalable con --scale kafka_consumer=N
  # Ejemplo: docker compose up --scale kafka_consumer=3
  kafka_consumer:
    build: ./kafka_consumer
    depends_on:
      respuestas:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      cache:
        condition: service_started
      datos:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=cache
      - RESPUESTAS_URL=http://respuestas:8000
      - DATOS_URL=http://datos:8000
      # Política de reintentos
      - MAX_REINTENTOS=3
      # Probabilidad de falla simulada en el generador de respuestas (0.0 a 1.0)
      - PROB_FALLA=0.0
    deploy:
      replicas: 1   # Cambiar a 3 para escenario multi-consumer
